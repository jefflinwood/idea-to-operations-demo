name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mergiraf-spike/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mergiraf-spike install --frozen-lockfile
      - run: pnpm types
      - run: pnpm typecheck
      - run: pnpm pack-demo && git diff --exit-code -- src/demo-files.generated.ts
      - run: pnpm exec wrangler deploy --dry-run
      - run: pnpm --dir mergiraf-spike exec wrangler deploy --dry-run --containers-rollout=none
