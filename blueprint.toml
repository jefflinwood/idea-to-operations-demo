[page."/decisions"]
title = "Decisions"
auth = "required"
layout = "custom"
live = true

[page."/decisions".query.outcomes]
entity = "Outcome"
orderBy = { createdAt = "asc" }
limit = 50

[page."/decisions".query.tasks]
entity = "Task"
orderBy = { createdAt = "asc" }
limit = 500

[page."/decisions".query.changes]
entity = "Change"
orderBy = { createdAt = "asc" }
limit = 500

[page."/decisions".query.checks]
entity = "Check"
orderBy = { createdAt = "asc" }
limit = 1000

[page."/decisions".query.decisions]
entity = "Decision"
orderBy = { createdAt = "desc" }
limit = 100

[page."/decisions".query.events]
entity = "ChangeEvent"
orderBy = { createdAt = "desc" }
limit = 200

[page."/decisions".query.pending]
entity = "Decision"
where = { status = "pending" }
limit = 50

[page."/decisions".template]
engine = "liquid"
type = "file"
source = "templates/decisions.liquid"

[page."/runs"]
title = "Runs"
auth = "required"
layout = "list"
live = true

[page."/runs".query.runs]
entity = "Repository"
orderBy = { createdAt = "desc" }
limit = 25

[page."/runs/:id"]
title = "Swarm"
auth = "required"
layout = "board"
live = true

[page."/runs/:id".query.tasks]
entity = "Task"
where = { repositoryId = "$params.id" }
orderBy = { createdAt = "asc" }
limit = 250

[page."/runs/:id".board]
query = "tasks"
groupBy = "status"
columns = [
  { value = "ready", label = "Queued" },
  { value = "claimed", label = "Claimed" },
  { value = "working", label = "Working" },
  { value = "submitted", label = "Submitted" },
  { value = "completed", label = "Completed" }
]
card = { title = "title", href = "/changes/{changeId}", fields = ["claimedBy"] }

[page."/runs/:id/changes"]
title = "Changes"
auth = "required"
layout = "board"
live = true

[page."/runs/:id/changes".query.changes]
entity = "Change"
where = { repositoryId = "$params.id" }
orderBy = { createdAt = "asc" }
limit = 250

[page."/runs/:id/changes".board]
query = "changes"
groupBy = "status"
columns = [
  { value = "working", label = "Working" },
  { value = "submitted", label = "Submitted" },
  { value = "integrating", label = "Merging with main" },
  { value = "verifying", label = "Type-checking" },
  { value = "ready", label = "Landing" },
  { value = "needs_decision", label = "Needs a human" },
  { value = "revision", label = "Revising" },
  { value = "completed", label = "Completed" }
]
card = { title = "title", href = "/changes/{id}", fields = ["actorId", "headSha"] }

[page."/changes/:id"]
title = "Change"
auth = "required"
layout = "detail"
live = true

[page."/changes/:id".query.change]
entity = "Change"
where = { id = "$params.id" }

[page."/changes/:id".query.checks]
entity = "Check"
where = { changeId = "$params.id" }
orderBy = { createdAt = "asc" }
limit = 100

[page."/changes/:id".query.events]
entity = "ChangeEvent"
where = { changeId = "$params.id" }
orderBy = { createdAt = "asc" }
limit = 200

[page."/changes/:id".query.decisions]
entity = "Decision"
where = { changeId = "$params.id" }
orderBy = { createdAt = "asc" }
limit = 20

[page."/decisions/:id"]
title = "Decision"
auth = "required"
layout = "detail"
live = true

[page."/decisions/:id".query.decision]
entity = "Decision"
where = { id = "$params.id" }

[page."/decisions/:id".actionBar]
title = "A human needs to decide"
description = "Zebric stopped this change: it passed Git and the structural merge but fails verification. Your choice resumes the durable workflow."
statusField = "status"

[[page."/decisions/:id".actionBar.actions]]
label = "Return for revision"
workflow = "ResolveDecisionAction"
style = "primary"
payload = { choice = "return_for_revision" }
visibleWhen = { status = "pending" }
successMessage = "Returned for revision. The workflow has resumed."

[[page."/decisions/:id".actionBar.actions]]
label = "Preserve old contract"
workflow = "ResolveDecisionAction"
style = "secondary"
payload = { choice = "preserve_contract" }
visibleWhen = { status = "pending" }
successMessage = "Recorded. The workflow has resumed."

[[page."/decisions/:id".actionBar.actions]]
label = "Abandon change"
workflow = "ResolveDecisionAction"
style = "danger"
payload = { choice = "abandon" }
visibleWhen = { status = "pending" }
confirm = "Abandon this change?"
successMessage = "Change abandoned."

# The seam to the Cloudflare Workflow that is waiting for the human (implemented in src/bridge.ts).
[service.changeflow]
description = "Signals the durable Cloudflare ChangeWorkflow."

[service.changeflow.operations.start_build]
description = "Start the agent build for an Outcome."

[service.changeflow.operations.verify_live]
description = "Check that the Worker deployed by Workers Builds serves the commit on main and that every page renders."

[service.changeflow.operations.signal_decision]
description = "Send the human's decision to the waiting ChangeWorkflow instance."

# What the Decision page's buttons run: the same ResolveDecision command agents' policies protect, then the signal.
[workflow.ResolveDecisionAction]
description = "A human resolves a pending Decision from the UI."
trigger = { manual = true }

[[workflow.ResolveDecisionAction.steps]]
type = "command"
command = "ResolveDecision"
recordId = "{{ variables.data.record.changeId }}"
input = { decisionId = "{{ variables.data.record.id }}", choice = "{{ variables.data.payload.choice }}" }

[[workflow.ResolveDecisionAction.steps]]
type = "service"
service = "changeflow"
operation = "signal_decision"
[workflow.ResolveDecisionAction.steps.params]
changeId = "{{ variables.data.record.changeId }}"
decisionId = "{{ variables.data.record.id }}"
choice = "{{ variables.data.payload.choice }}"

