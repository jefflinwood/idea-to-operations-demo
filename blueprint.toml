# --- Outcome actions the pages' buttons run -----------------------------------------------------------------

[workflow.StartBuildAction]
description = "The human commits to the Outcome; the agent organization starts building it."
trigger = { manual = true }

[[workflow.StartBuildAction.steps]]
type = "command"
command = "StartBuild"
recordId = "{{ variables.data.record.id }}"

[[workflow.StartBuildAction.steps]]
type = "service"
service = "changeflow"
operation = "start_build"
[workflow.StartBuildAction.steps.params]
outcomeId = "{{ variables.data.record.id }}"

[workflow.LaunchAction]
description = "Launch the finished Outcome."
trigger = { manual = true }

[[workflow.LaunchAction.steps]]
type = "command"
command = "LaunchOutcome"
recordId = "{{ variables.data.record.id }}"

[[workflow.LaunchAction.steps]]
type = "service"
service = "changeflow"
operation = "verify_live"
[workflow.LaunchAction.steps.params]
outcomeId = "{{ variables.data.record.id }}"

[workflow.AdoptAction]
description = "The builder accepts responsibility: Level 0 to Level 1."
trigger = { manual = true }

[[workflow.AdoptAction.steps]]
type = "command"
command = "AdoptOutcome"
recordId = "{{ variables.data.record.id }}"

[workflow.PromoteAction]
description = "Ask for Level 2 (team) promotion."
trigger = { manual = true }

[[workflow.PromoteAction.steps]]
type = "command"
command = "RequestTeamPromotion"
recordId = "{{ variables.data.record.id }}"

[ui]
render_mode = "server"
theme = "default"
view_transitions = true
